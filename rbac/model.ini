[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act, eft, condition, id

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
# Deny rules from Permissions and RoleBindings never apply to admins. Built-in deny rules (id "na") still do.
m = g(r.sub, p.sub) && (p.obj == '*' || r.obj == p.obj) && matchAction(r.act, p.act) && (p.condition == '' || (!isString(r.obj) && eval(p.condition))) && !(p.eft == 'deny' && p.id != 'na' && p.id != '' && g(r.sub, 'admin'))
